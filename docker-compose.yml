services:

  postgres:
    image: postgres:18-alpine
    container_name: okdriver-postgres

    environment:
      POSTGRES_DB: okdriver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: okdriver_docker_dev

    ports:
      - "5432:5432"

    volumes:
      - okdriver_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d okdriver"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: okdriver-backend

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql://postgres:okdriver_docker_dev@postgres:5432/okdriver
      JWT_ALGORITHM: HS256

    ports:
      - "8000:8000"


  frontend:
    build:
      context: ./frontend

    container_name: okdriver-frontend

    depends_on:
      - backend

    ports:
      - "5173:80"


volumes:
  okdriver_postgres_data: